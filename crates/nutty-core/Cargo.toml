[package]
name = "nutty-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
dirs.workspace = true
getrandom.workspace = true
keyring.workspace = true
# The same crate keyring builds on; Entry and Error types are shared with it.
keyring-core = "1.0.1"
reqwest.workspace = true
russh.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
zeroize.workspace = true
url.workspace = true

tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Secret Service store (Linux and BSD), opened directly so it can be retried; see config.rs.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
