# Third-party license notices bundled with every release archive.
# Generate with: cargo about generate --all-features --fail -o THIRD-PARTY-NOTICES.txt about.hbs
# The accepted licenses mirror [licenses] in deny.toml; keep both lists in sync.

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# One notice file covers every shipped platform, so each archive is complete.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

# Workspace crates are Nutty itself, covered by LICENSE.
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }
