name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  linux:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux GUI libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake g++ libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libfontconfig1-dev
      - name: Isolate test configuration
        run: echo "NUTTY_DATA_DIR=$RUNNER_TEMP/nutty-test-config" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-x86_64
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked --all-targets --all-features
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --workspace --locked --no-deps
      - name: Package Linux
        run: sh scripts/bundle-linux.sh release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nutty-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
