name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  NUTTY_RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-2025
            platform: windows-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake g++ libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libfontconfig1-dev
      - name: Isolate test configuration
        shell: bash
        run: echo "NUTTY_DATA_DIR=$RUNNER_TEMP/nutty-test-config" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.platform }}
          cache-on-failure: true
      # Not every runner has a prebuilt cargo-about, and a source build needs the cli feature.
      - name: Install cargo-about
        shell: bash
        run: command -v cargo-about || cargo install --locked cargo-about --features cli
      - name: Check package and tag versions
        run: python scripts/check-version.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked --all-targets --all-features
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --workspace --locked --no-deps
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          sh scripts/bundle-macos.sh release
          sh scripts/check-release-macos.sh --development
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/release/Nutty.app "dist/Nutty-${NUTTY_RELEASE_TAG}-${PLATFORM}.zip"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bundle-windows.ps1 release
      - name: Package Linux
        if: runner.os == 'Linux'
        run: sh scripts/bundle-linux.sh release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nutty-${{ github.ref_name }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      # deny.toml lists the shipped targets and every reviewed exemption. This checks
      # advisories, licenses, banned crates and dependency sources.
      - name: Check dependency policy for all shipped targets
        id: audit
        continue-on-error: true
        run: cargo deny --workspace --all-features --format json check > dependency-check.jsonl 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-advisories
          path: dependency-check.jsonl
      - name: Report findings and block stable releases
        if: steps.audit.outcome != 'success'
        run: |
          echo '::warning::Dependency policy (deny.toml) did not pass. Read the dependency-advisories artifact.'
          echo 'Dependency policy did not pass. Pre-releases continue with this warning; stable tags are blocked.' >> "$GITHUB_STEP_SUMMARY"
          case "$NUTTY_RELEASE_TAG" in *-*) ;; *) exit 1 ;; esac

  release:
    name: Publish preview or prepare draft
    needs: [build, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Nutty-*
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Notes come from this version's CHANGELOG section plus install instructions.
          python3 scripts/release-notes.py > release-notes.md
          cd dist
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS.txt
          if [[ "$NUTTY_RELEASE_TAG" == *-* ]]; then
            gh release create "$NUTTY_RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt --verify-tag --title "Nutty $NUTTY_RELEASE_TAG · 预发布" --notes-file ../release-notes.md --prerelease --latest=false
          else
            # Stable tags stay a draft until the maintainer reviews and publishes them.
            gh release create "$NUTTY_RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt --verify-tag --title "Nutty $NUTTY_RELEASE_TAG" --notes-file ../release-notes.md --draft
          fi
