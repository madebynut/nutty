name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  NUTTY_RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate test configuration
        shell: bash
        run: echo "NUTTY_DATA_DIR=$RUNNER_TEMP/nutty-test-config" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.platform }}
          cache-on-failure: true
      - name: Check package and tag versions
        run: python scripts/check-version.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked --all-targets --all-features
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --workspace --locked --no-deps
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          sh scripts/bundle-macos.sh release
          sh scripts/check-release-macos.sh --development
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/release/Nutty.app "dist/Nutty-${NUTTY_RELEASE_TAG}-${PLATFORM}.zip"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bundle-windows.ps1 release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nutty-${{ github.ref_name }}-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - name: Audit all shipped targets
        id: audit
        continue-on-error: true
        run: |
          failed=0
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo deny --workspace --all-features --format json --target "$target" check advisories > "advisories-$target.jsonl" 2>&1 || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-advisories
          path: advisories-*.jsonl
      - name: Report findings and block stable releases
        if: steps.audit.outcome != 'success'
        run: |
          echo '::warning::Dependency audit did not pass. Read the dependency-advisories artifact; this build is not approved for production.'
          echo 'Dependency audit did not pass. Preview artifacts are for testing only; stable tags are blocked.' >> "$GITHUB_STEP_SUMMARY"
          case "$NUTTY_RELEASE_TAG" in *-*) ;; *) exit 1 ;; esac

  release:
    name: Publish preview or prepare draft
    needs: [build, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Nutty-*
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum ./*.zip > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Nutty for macOS (Apple Silicon / Intel) and Windows x86_64.

          Download the ZIP for your platform and verify it against SHA256SUMS.txt.
          macOS builds use an ad-hoc development signature; Windows builds are unsigned.
          These artifacts are for validation, not an enterprise production approval.
          Review the build checks and dependency-advisories artifact before deployment.
          正式分发仍需签名、公证、依赖门禁与真实桌面环境验收。临时版本请勿用于生产环境。
          NOTES
          if [[ "$NUTTY_RELEASE_TAG" == *-* ]]; then
            gh release create "$NUTTY_RELEASE_TAG" ./*.zip SHA256SUMS.txt --verify-tag --title "Nutty $NUTTY_RELEASE_TAG · Preview" --notes-file release-notes.md --prerelease --latest=false
          else
            gh release create "$NUTTY_RELEASE_TAG" ./*.zip SHA256SUMS.txt --verify-tag --title "Nutty $NUTTY_RELEASE_TAG" --notes-file release-notes.md --draft --latest=false
          fi
